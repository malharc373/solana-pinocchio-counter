name: Compute units

on: pull_request

jobs:
  cu-guard:
    permissions:
      contents: read
      pull-requests: write # for the comment
    uses: malharc373/solana-cu-guard/.github/workflows/compare.yml@v1
    with:
      solana-version: v3.1.10
      command: cargo build-sbf && cargo test --test cu_report
