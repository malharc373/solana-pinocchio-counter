[package]
name = "pinocchio-counter"
version = "0.1.0"
edition = "2021"
rust-version = "1.89.0"
description = "The solana-counter program rewritten in Pinocchio, with a compute-unit comparison against Anchor"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []

[dependencies]
pinocchio = { version = "0.12", features = ["cpi"] }
solana-address = { version = "2", features = ["decode"] }

[dev-dependencies]
litesvm = "0.10.0"
solana-rent = "3"
solana-account = "3"
solana-instruction = "3"
solana-keypair = "3.0.1"
solana-message = "3.0.1"
solana-pubkey = "3"
solana-signer = "3.0.0"
solana-transaction = "3.0.2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
